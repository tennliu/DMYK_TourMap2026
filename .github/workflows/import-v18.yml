name: Import DMYK v18 package

on:
  push:
    paths:
      - ".staging/ready"

permissions:
  contents: write

jobs:
  import-v18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify package
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/part* | tr -d '\n' | base64 -d > /tmp/dmyk-v18.zip
          echo "ea4876fe294d55d2bfc44d9f38c85999c34775efc08574a8d9e32c5060657e87  /tmp/dmyk-v18.zip" | sha256sum -c -
          mkdir -p /tmp/dmyk-v18
          unzip -q /tmp/dmyk-v18.zip -d /tmp/dmyk-v18
          test -f /tmp/dmyk-v18/DMYK_TourGuide_v18/index.html
          rsync -a --delete --exclude=".git" /tmp/dmyk-v18/DMYK_TourGuide_v18/ ./
      - name: Commit exact v18 contents
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy DMYK Tour Guide v18"
          git push
